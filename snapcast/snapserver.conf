[server]
datadir = /var/lib/snapserver

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780

[tcp]
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[stream]
bind_to_address = 0.0.0.0
port = 1704
# Hub ffmpeg connects and sends raw PCM (48 kHz stereo s16le)
source = tcp://0.0.0.0:4953?name=default&mode=server&sampleformat=48000:16:2

[logging]
filter = *:info
